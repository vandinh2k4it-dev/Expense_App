<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#14b085"/>
      <stop offset="0.48" stop-color="#0a8390"/>
      <stop offset="1" stop-color="#0b4f9e"/>
    </linearGradient>
    <radialGradient id="glowY" cx="0.95" cy="0.02" r="0.42">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffd45c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="0.05" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#6cf0b4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6cf0b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f3ea"/>
    </linearGradient>
    <linearGradient id="clasp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16b48a"/>
      <stop offset="1" stop-color="#0b5aa8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19c08f"/>
      <stop offset="1" stop-color="#0b5aa8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#04284a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glowG)"/>
  <rect width="1024" height="1024" fill="url(#glowY)"/>

  <g transform="translate(512 500) scale(1.14) translate(-551 -525)">
    <!-- thẻ vàng thò ra sau ví -->
    <g filter="url(#sh)">
      <rect x="300" y="240" width="430" height="280" rx="60" fill="url(#card)" transform="rotate(-9 512 380)"/>
    </g>
    <rect x="360" y="300" width="170" height="26" rx="13" fill="#ffffff" fill-opacity="0.55" transform="rotate(-9 512 380)"/>

    <!-- thân ví -->
    <g filter="url(#sh)">
      <rect x="212" y="400" width="600" height="400" rx="120" fill="url(#body)"/>
    </g>

    <!-- cột thống kê -->
    <rect x="290" y="630" width="56" height="100" rx="20" fill="url(#bar)"/>
    <rect x="376" y="575" width="56" height="155" rx="20" fill="url(#bar)"/>
    <rect x="462" y="515" width="56" height="215" rx="20" fill="url(#bar)"/>

    <!-- khóa ví -->
    <rect x="640" y="540" width="250" height="144" rx="72" fill="url(#clasp)"/>
    <circle cx="734" cy="612" r="30" fill="#ffffff"/>
  </g>
</svg>
